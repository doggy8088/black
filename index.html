  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const theme = localStorage.getItem('screen-theme');
      if (theme === 'light' || theme === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = theme;
      }
    } catch { /* Site storage can be disabled. */ }
  </script>
  <title>純色全螢幕｜黑色畫面、白色畫面、綠色畫面</title>
  <meta name="description" content="一鍵切換黑、白、綠三種全螢幕畫面。用黑色看清螢幕上的灰塵、用白色照亮暗處，或用綠色當拍攝背景。">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "純色全螢幕",
      "url": "https://black.miniasp.com/",
      "description": "免費切換黑、白、綠三種全螢幕畫面。",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "inLanguage": "zh-TW",
      "isAccessibleForFree": true,
      "author": {
        "@type": "Person",
        "name": "Will 保哥的技術交流中心",
        "url": "https://www.facebook.com/will.fans/",
        "sameAs": ["https://www.facebook.com/will.fans/"]
      }
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳至色彩選擇</a>
  <header class="site-header frame">
    <span class="wordmark"><img alt="" src="assets/icons/icon-48.png" width="28" height="28"> 純色全螢幕</span>
    <label class="theme" id="theme-control" hidden>
      <span>外觀</span>
      <select id="theme">
        <option value="light dark">跟隨系統</option>
        <option value="light">淺色</option>
        <option value="dark">深色</option>
      </select>
    </label>
  </header>
  <main class="frame" id="main">
    <div class="intro">
      <h1>純色全螢幕</h1>
      <p>選個顏色，一鍵填滿螢幕。</p>
    </div>
    <div class="palette" aria-label="螢幕顏色" role="group" inert>
      <button class="swatch" data-color="black" type="button" aria-labelledby="black-name" aria-describedby="black-use">
        <span class="swatch-face">
          <span class="expand" aria-hidden="true"></span>
          <span class="swatch-name" id="black-name">黑色畫面</span>
          <span class="swatch-code">#000000</span>
        </span>
        <span class="swatch-use" id="black-use">擦拭前看清灰塵</span>
      </button>
      <button class="swatch" data-color="white" type="button" aria-labelledby="white-name" aria-describedby="white-use">
        <span class="swatch-face">
          <span class="expand" aria-hidden="true"></span>
          <span class="swatch-name" id="white-name">白色畫面</span>
          <span class="swatch-code">#FFFFFF</span>
        </span>
        <span class="swatch-use" id="white-use">在暗處臨時照明</span>
      </button>
      <button class="swatch" data-color="green" type="button" aria-labelledby="green-name" aria-describedby="green-use">
        <span class="swatch-face">
          <span class="expand" aria-hidden="true"></span>
          <span class="swatch-name" id="green-name">綠色畫面</span>
          <span class="swatch-code">#00FF00</span>
        </span>
        <span class="swatch-use" id="green-use">拍攝時當作去背背景</span>
      </button>
    </div>
    <p id="instructions" class="instructions">全螢幕時，輕點畫面或按 <kbd>Esc</kbd> 返回。</p>
    <noscript><p>請啟用 JavaScript 以開啟全螢幕。</p></noscript>
  </main>
  <footer class="site-footer frame">
    <span>© 2026 <a href="https://www.facebook.com/will.fans/" target="_blank" rel="noopener noreferrer">Will 保哥的技術交流中心</a></span>
    <span><a href="LICENSE">MIT 授權</a></span>
  </footer>
  <dialog id="display" aria-label="純色全螢幕" aria-describedby="exit-hint">
    <button id="display-color" type="button" autofocus aria-label="離開全螢幕"></button>
    <span class="visually-hidden" id="exit-hint">輕點畫面或按 Esc 返回。</span>
  </dialog>
</body>
</html>
